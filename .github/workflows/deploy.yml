name: Build and Deploy to Azure Web App

# main 브랜치에 코드가 push될 때마다 CI/CD 자동 실행
on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: st713-app      # 빌드될 Docker 이미지 이름
  WEBAPP_NAME: st713-webapp  # 2단계에서 생성한 Web App 이름

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. GitHub 리포지토리 코드 체크아웃
    - name: Checkout GitHub Actions
      uses: actions/checkout@v3

    # 2. Azure Container Registry 로그인
    - name: Log in to ACR
      uses: azure/docker-login@v1
      with:
        login-server: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    # 3. Docker 이미지 빌드 및 ACR로 Push 
    # 태그는 고유 식별을 위해 GitHub Commit SHA를 사용합니다.
    - name: Build and Push Docker image
      run: |
        docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

    # 4. Azure Web App에 새 이미지 배포
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        images: '${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'